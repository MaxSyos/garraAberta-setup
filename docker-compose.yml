services:
  hermes:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    container_name: hermes-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ./workspace:/workspace
      - ./hermes-data:/root/.hermes
    depends_on:
      - postgres
    networks:
      - hermes-net

  postgres:
    image: postgres:17
    container_name: hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: troque_essa_senha
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge
