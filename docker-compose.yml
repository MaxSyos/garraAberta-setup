services:
  hermes:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    container_name: hermes-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - ./workspace:/workspace
      - ./hermes-data:/root/.hermes
    depends_on:
      - postgres
    networks:
      - hermes-net

  postgres:
    image: postgres:17
    container_name: hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes123456
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - hermes-net

  ngrok:
    image: wernight/ngrok
    container_name: hermes-ngrok
    restart: unless-stopped
    depends_on:
      - hermes
    environment:
      NGROK_AUTHTOKEN: 2DYF8GMGCw7YvMRTmlgJY2J3Jih_86kKhTKDRVZ4QaC8o6u7w
    command: sh -c 'if [ -z "$NGROK_AUTHTOKEN" ]; then echo "NGROK_AUTHTOKEN is not set; ngrok disabled."; sleep infinity; else exec ngrok http hermes:8080 --log=stdout; fi'
    networks:
      - hermes-net

networks:
  hermes-net:
    driver: bridge
